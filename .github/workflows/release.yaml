name: Release
on:
  push:
    tags:
      - "v*"
jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Code checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2

      - name: Build release binaries
        env:
          CGO_ENABLED: 0
        run: |
          # The version is shown as "v<version>", so leave out the tag's own "v".
          VERSION="${GITHUB_REF_NAME#v}"
          GOARCH=amd64 go build -o dist/nycto-wings_linux_amd64 -v -trimpath -ldflags="-s -w -X github.com/nycto-sh/wings/system.Version=${VERSION}" github.com/nycto-sh/wings
          chmod 755 dist/nycto-wings_linux_amd64
          GOARCH=arm64 go build -o dist/nycto-wings_linux_arm64 -v -trimpath -ldflags="-s -w -X github.com/nycto-sh/wings/system.Version=${VERSION}" github.com/nycto-sh/wings
          chmod 755 dist/nycto-wings_linux_arm64
          (cd dist && sha256sum nycto-wings_linux_* > checksums.txt)

      - name: Create release branch
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          BRANCH=release/${{ env.VERSION }}
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git checkout -b $BRANCH
          git push -u origin $BRANCH
          sed -i "s/var Version = \".*\"/var Version = \"${VERSION:1}\"/" system/const.go
          git add system/const.go
          git commit -m "ci(release): bump version"
          git push

      - name: write changelog
        run: |
          sed -n "/^## ${{ github.ref_name }}/,/^## /{/^## /b;p}" CHANGELOG.md > ./RELEASE_CHANGELOG

      - uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          body_path: ./RELEASE_CHANGELOG
          files: |
            dist/*
