version: '3.8'

services:
  nycto-wings:
    image: ghcr.io/nycto-sh/wings:latest
    restart: always
    networks:
      - nycto-wings0
    ports:
      - "8080:8080"
      - "2022:2022"
    tty: true
    environment:
      TZ: "UTC"
      NYCTO_UID: 989
      NYCTO_GID: 989
      NYCTO_USERNAME: nycto
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/var/lib/docker/containers/:/var/lib/docker/containers/"
      - "/etc/nycto/:/etc/nycto/"
      - "/var/lib/nycto/:/var/lib/nycto/"
      - "/var/log/nycto/:/var/log/nycto/"
      - "/tmp/nycto/:/tmp/nycto/"
      - "/etc/ssl/certs:/etc/ssl/certs:ro"
      - "/run/nycto-wings:/run/nycto-wings"
      # Required for ssl if you use let's encrypt. uncomment to use.
      #- "/etc/letsencrypt/:/etc/letsencrypt/"

networks:
  nycto-wings0:
    name: nycto-wings0
    driver: bridge
    ipam:
      config:
        - subnet: "172.22.0.0/16"
    driver_opts:
      com.docker.network.bridge.name: nycto-wings0
